<div class="bg-dark border-right p-3 min-vh-100" id="sidebar">
    <h3 class="text-light">GifsApp</h3>
    <hr class="text-white">

    <div class="list-group list-reset">
        @for (tag of tagHistory; track $index) {
            <button
                class="list-group-item list-group-item-action"
                [class.active]="selectedTag === tag"
                [disabled]="selectedTag === tag"
                (click)="searchFromButton(tag)">
                {{ tag | titlecase }}
            </button>
        }
    </div>
</div>
