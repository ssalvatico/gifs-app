<div class="row">
        
    <div *ngFor="let gif of gifsCards" class="col-md-3 col-sm-6">
        <div class="card mb-2 bg-dark text-center">
            
            <img
                [src]="gif.images.downsized_medium.url"
                [alt]="gif.title"
                class="card-img-top"
                style="position:sticky;"
                >
            
            <div class="card-body">
                
                <p class="card-text text-white">
                    {{ gif.title }}
                </p>
                
            </div>
        </div>
    </div>
</div>
